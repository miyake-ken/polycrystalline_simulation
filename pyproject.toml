[project]
name = "wild1990-evolutionary-selection"
version = "0.1.0"
description = "Exact 2-D reproduction of the evolutionary-selection model in Wild, Herres & Koidl, J. Appl. Phys. 68, 973 (1990)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evosel2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
