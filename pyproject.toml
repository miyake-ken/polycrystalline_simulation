[project]
name = "wild1990-evolutionary-selection"
version = "0.1.0"
description = "Exploratory 2-D and blocked kinetic-Wulff 3-D simulations of polycrystalline faceted film growth"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "numba>=0.61", "scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evosel2d", "src/evosel3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
